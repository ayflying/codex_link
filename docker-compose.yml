services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: codex_link
      MYSQL_USER: codex_link
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-codex_link_default_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-codex_link_default_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  relay:
    image: ghcr.io/ayflying/codex_link:latest
    pull_policy: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "8787"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: codex_link
      DB_USER: codex_link
      DB_PASSWORD: ${MYSQL_PASSWORD:-codex_link_default_password}
      UPLOAD_DIR: /data/uploads
      WEB_DIR: /app/web
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      WEBRTC_STUN_PORT: "3478"
      WEBRTC_STUN_PUBLIC_PORT: "3478"
      WEBRTC_STUN_PUBLIC_HOST: ""
      WEBRTC_P2P_ONLY: "false"
    volumes:
      - data:/data
    ports:
      - "18787:8787"
      - "3478:3478/udp"
    restart: unless-stopped

volumes:
  data:
  mysql_data:
