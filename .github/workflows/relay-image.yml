name: 发布 Relay 镜像

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-image-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ayflying/codex_link

jobs:
  build-and-push:
    name: 构建并推送 Relay 镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: 读取镜像版本
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 构建并推送版本与 latest 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.relay
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            CODEX_LINK_VERSION=${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest

      - name: 核对版本与 latest 镜像 digest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          version_digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          latest_digest="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')"
          test -n "$version_digest"
          test "$version_digest" = "$latest_digest"
          echo "镜像 digest: $version_digest"
